server {
    listen [::]:443 ssl ipv6only=on;
    server_name danmu-origin.oyo131.xyz;

    ssl_certificate /etc/danmu-api/origin.crt;
    ssl_certificate_key /etc/danmu-api/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:danmu_origin_tls:1m;
    ssl_session_timeout 1h;

    client_max_body_size 256k;

    # The origin has only an AAAA record, so Cloudflare connects over one of
    # its published IPv6 egress ranges. Keep the public socket unreachable to
    # arbitrary Internet clients even if the shared secret is guessed.
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    if ($http_x_danmu_origin_auth != "__ORIGIN_SHARED_SECRET__") {
        return 403;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host danmu.oyo131.xyz;
        proxy_set_header X-Forwarded-Host danmu.oyo131.xyz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:9321;
    }
}
